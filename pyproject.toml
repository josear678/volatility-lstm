[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "volatility-lstm"
version = "0.1.0"
description = "LSTM-based forecasting of one-week-ahead realized stock volatility from price history and the VIX."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jose Rueda Chavez" }]
keywords = ["lstm", "volatility", "forecasting", "finance", "tensorflow", "yfinance"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy==2.1.3",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "tensorflow>=2.15,<3.0",
    "scikit-learn==1.7.2",
    "joblib==1.5.2",
    "yfinance==1.2.0",
    "matplotlib==3.10.6",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "jupyterlab==4.5.6",
]

[project.scripts]
train-volatility-lstm = "src.train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
